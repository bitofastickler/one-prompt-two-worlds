name: Verify exhibit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen sources, downloads, and local links
        run: python scripts/verify.py
      - name: Check game syntax
        run: |
          node --check games/lastlight/game.js
          node --check games/last-light-lancer/game.js
      - name: Exercise both game engines
        run: |
          node games/lastlight/test-game.cjs
          node tests/lancer.cjs
